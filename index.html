.key-box::after {
  content: '';

.key-input:focus { border-left-color: var(--red); }
.key-input::placeholder { color: var(--muted); }

.key-save {
  width: 100%; padding: 14px;
  background: var(--red); color: #fff; border: none;
  font-family: 'Bebas Neue', sans-serif;

  text-shadow: 1px 0 0 rgba(0,0,0,0.4);

.key-save:active { background: var(--red-bright); }
.key-note { font-family: 'Share Tech Mono', monospace; font-size: 10px; color: var(--muted); }
.key-error { font-family: 'Share Tech Mono', monospace; font-size: 11px; color: var(--red-bright); display: none; }
.key-error.show { display: block; }

.header-red-bar {
  height: 4px;
  background: var(--red);

}

header {
  border-bottom: 1px solid var(--border2);
  flex-shrink: 0; position: relative; z-index: 1;
  background: linear-gradient(180deg, rgba(30,16,8,1) 0%, rgba(20,10,5,1) 100%);
}

.header-inner {
  padding: 10px 20px 14px;
  display: flex; align-items: flex-end; gap: 14px;
}

.logo-block { flex: 1; }

.logo {
  font-family: 'Bebas Neue', sans-serif;
  letter-spacing: 4px;
  line-height: 1;
  display: flex; align-items: baseline; gap: 0;

  transform: translateY(-50%) rotate(-8deg);
}

.logo-sr {
  font-size: 40px; color: var(--cream);
  text-shadow: 1px 0 0 rgba(212,184,144,0.1);
}

.logo-tagline {
  font-family: 'Special Elite', cursive;
  font-size: 10px; color: var(--muted);
  letter-spacing: 1px; margin-top: 5px;
  display: block; transform: rotate(-0.5deg);
}

.key-btn {
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px; color: var(--muted);
  cursor: pointer; padding: 6px 10px;
  border: 1px solid var(--border); background: none;
  letter-spacing: 2px; margin-bottom: 4px; transition: all 0.15s;
}

  const v=document.getElementById('videoFeed');v.style.display='none';v.srcObject=null;
  document.getElementById('cameraIdle').style.display='flex';

  cameraActive=false;
  document.getElementById('cameraBtn').textContent='Camera';

function captureAndAppraise(){
  const v=document.getElementById('videoFeed');const c=document.getElementById('snapCanvas');const img=document.getElementById('capturedImage');
  if(cameraActive&&v.readyState>=2){
    c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);
    capturedDataURL=c.toDataURL('image/jpeg',0.92);
    const flash=document.createElement('div');flash.className='flash';document.getElementById('cameraWrap').appendChild(flash);setTimeout(()=>flash.remove(),300);
    img.src=capturedDataURL;img.style.display='block';v.style.display='none';
    document.getElementById('scanBeam').classList.add('active');setTimeout(()=>document.getElementById('scanBeam').classList.remove('active'),1500);
  }
  if(capturedDataURL){if(window.innerWidth<=700)setTimeout(()=>document.getElementById('rightPanel').scrollIntoView({behavior:'smooth'}),300);runAppraisal(capturedDataURL);}
}

function handleUpload(e){
  const file=e.target.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=ev=>{
    capturedDataURL=ev.target.result;
    const img=document.getElementById('capturedImage');img.src=capturedDataURL;img.style.display='block';
    document.getElementById('cameraIdle').style.display='none';document.getElementById('videoFeed').style.display='none';
    document.getElementById('captureBtn').disabled=false;document.getElementById('shutterBtn').disabled=false;
    if(window.innerWidth<=700)setTimeout(()=>document.getElementById('rightPanel').scrollIntoView({behavior:'smooth'}),300);
    runAppraisal(capturedDataURL);
  };r.readAsDataURL(file);
}

function setState(s){
  document.getElementById('idleState').style.display=s==='idle'?'flex':'none';
  document.getElementById('loadingState').classList.toggle('active',s==='loading');
  document.getElementById('errorState').classList.toggle('active',s==='error');
  document.getElementById('resultsArea').classList.toggle('active',s==='results');
}

function setStep(n){
  for(let i=1;i<=4;i++){const el=document.getElementById('step'+i);el.classList.remove('active','done');if(i<n)el.classList.add('done');else if(i===n)el.classList.add('active');}
}

async function runAppraisal(dataURL){
  setState('loading');
  setStep(1);

  [0,1800,3200,4800].forEach((t,i)=>{
    setTimeout(()=>setStep(i+1),t);
  });

  const base64 = dataURL.split(',')[1];
  const mediaType = dataURL.split(';')[0].split(':')[1];
  const hint = document.getElementById('hintInput').value.trim();

  try {
    const res = await fetch('/api/appraise', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        image: base64,
        mediaType,
        hint
      })
    });

    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.error || 'API error ' + res.status);
    }

    if (!data.identified) {
      document.getElementById('errorDetail').textContent =
        data.errorMessage || 'Could not identify.';
      setState('error');
      return;
    }

    renderResults(data);

  } catch(e) {
    console.error(e);

    document.getElementById('errorDetail').textContent =
      e.message || 'Appraisal failed.';

    setState('error');
  }
}



function esc(s){
  if(s===null||s===undefined)return'';
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmt(n){return n?'$'+Math.round(n).toLocaleString():'$—';}
function trendCls(t){return t==='up'?'trend-up':t==='down'?'trend-down':'trend-stable';}
function trendLbl(t){return t==='up'?'↑ Rising':t==='down'?'↓ Falling':'→ Stable';}

  setState('results');
  setTimeout(()=>{const b=document.getElementById('confBar');if(b)b.style.width=r.confidenceScore+'%';},100);
}

function resetAppraisal(){
  capturedDataURL=null;
  const capturedImg=document.getElementById('capturedImage');
  capturedImg.style.display='none';
  capturedImg.src='';
  document.getElementById('fileInput').value='';
  document.getElementById('hintInput').value='';
  if(cameraActive){
    // camera is still live — bring the video feed back instead of leaving a blank box
    document.getElementById('videoFeed').style.display='block';
  }else{
    document.getElementById('cameraIdle').style.display='flex';
  }
  document.getElementById('captureBtn').disabled=!cameraActive;
  document.getElementById('shutterBtn').disabled=!cameraActive;
  setState('idle');
  if(window.innerWidth<=700)document.getElementById('cameraWrap').scrollIntoView({behavior:'smooth',block:'start'});
}

window.addEventListener('pagehide',()=>{if(stream)stream.getTracks().forEach(t=>t.stop());});
document.addEventListener('visibilitychange',()=>{
  // don't kill the camera on a quick tab-switch, but do release it if the page is backgrounded a while
  if(document.hidden&&stream){
    setTimeout(()=>{if(document.hidden&&stream){stream.getTracks().forEach(t=>t.stop());stream=null;}},15000);
  }
});

const wrap=document.getElementById('cameraWrap');
wrap.addEventListener('dragover',e=>e.preventDefault());
wrap.addEventListener('drop',e=>{
  e.preventDefault();const file=e.dataTransfer.files[0];
  if(file?.type.startsWith('image/')){
    const reader=new FileReader();
    reader.onload=ev=>{capturedDataURL=ev.target.result;document.getElementById('capturedImage').src=capturedDataURL;document.getElementById('capturedImage').style.display='block';document.getElementById('cameraIdle').style.display='none';document.getElementById('captureBtn').disabled=false;runAppraisal(capturedDataURL);};
    reader.readAsDataURL(file);
  }
});
